<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DogWalk">
<title>DogWalk Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fdf0f7;color:#1c1c1e;min-height:100vh}
  .header{background:linear-gradient(135deg,#e0589e,#c2185b);color:#fff;padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:100}
  .header h1{font-size:20px;font-weight:700}
  .header p{font-size:13px;opacity:0.85;margin-top:3px}
  .tabs{display:flex;background:#fff;border-bottom:0.5px solid #f0c0da}
  .tab{flex:1;padding:11px 0;font-size:14px;font-weight:500;text-align:center;color:#c06090;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
  .tab.active{color:#c2185b;border-bottom-color:#c2185b}
  .section{display:none;padding:16px}
  .section.active{display:block}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:0.5px solid #f0c0da}
  .card-title{font-size:15px;font-weight:600;color:#1c1c1e;margin-bottom:12px}
  .person-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
  .badge-a{background:#fde8f4;color:#9b1a6a}
  .badge-b{background:#f8d0e8;color:#7a0f52}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:12px;color:#c06090;margin-bottom:5px;font-weight:500}
  .form-group input,.form-group select{width:100%;padding:10px 12px;border:0.5px solid #f0c0da;border-radius:10px;font-size:15px;background:#fdf7fb;color:#1c1c1e;appearance:none;-webkit-appearance:none;outline:none}
  .form-group input:focus,.form-group select:focus{border-color:#c2185b;background:#fff}
  .btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.1s;margin-bottom:8px}
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:linear-gradient(135deg,#e0589e,#c2185b);color:#fff}
  .btn-secondary{background:#fff;color:#c2185b;border:1.5px solid #f0c0da}
  .walk-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:0.5px solid #f0c0da;display:flex;align-items:center;gap:12px}
  .checkbox{width:26px;height:26px;border-radius:50%;border:2px solid #f0c0da;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;background:#fff}
  .checkbox.checked{background:#c2185b;border-color:#c2185b}
  .checkbox svg{display:none}
  .checkbox.checked svg{display:block}
  .walk-info{flex:1}
  .walk-date{font-size:15px;font-weight:600;color:#1c1c1e}
  .walk-meta{font-size:12px;color:#c06090;margin-top:2px}
  .empty{text-align:center;padding:40px 20px;color:#d4a0bc}
  .empty-icon{font-size:44px;margin-bottom:8px}
  .empty p{font-size:14px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:#fff;border-radius:12px;padding:12px;text-align:center;border:0.5px solid #f0c0da}
  .stat-num{font-size:26px;font-weight:700;color:#c2185b}
  .stat-label{font-size:11px;color:#c06090;margin-top:2px}
  .filter-row{display:flex;gap:8px;margin-bottom:14px}
  .filter-btn{flex:1;padding:8px 0;border-radius:10px;border:0.5px solid #f0c0da;background:#fff;font-size:13px;font-weight:500;color:#c06090;cursor:pointer;transition:all 0.2s}
  .filter-btn.active{background:#c2185b;color:#fff;border-color:#c2185b}
  .archive-item{background:#fdf7fb;border-radius:14px;padding:13px 14px;margin-bottom:8px;border:0.5px solid #f0c0da;display:flex;justify-content:space-between;align-items:center}
  .archive-date{font-size:14px;font-weight:600;color:#7a3a5a}
  .archive-meta{font-size:12px;color:#c06090;margin-top:2px}
  .info-box{background:#fff3f8;border:1px solid #f0c0da;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#7a3a5a;line-height:1.5}
</style>
</head>
<body>

<div class="header">
  <h1>🐾 DogWalk Tracker</h1>
  <p id="person-name">Lade …</p>
</div>

<!-- PERSONEN-AUSWAHL -->
<div id="screen-person" style="padding:24px 16px;display:block">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font-size:48px;margin-bottom:12px">🐕</div>
    <div style="font-size:18px;font-weight:600;color:#c2185b;margin-bottom:6px">Wer bist du?</div>
    <div style="font-size:14px;color:#c06090">Wähle deinen Namen um zu starten</div>
  </div>
  <button class="btn btn-primary" style="margin-bottom:12px" onclick="selectPerson('A')">🌸 Ich bin Jonna</button>
  <button class="btn btn-primary" onclick="selectPerson('B')">🌸 Ich bin Theda</button>
</div>

<!-- HAUPT-APP -->
<div id="screen-app" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('erfassen')">Erfassen</button>
    <button class="tab" onclick="switchTab('offen')">Offen</button>
    <button class="tab" onclick="switchTab('archiv')">Archiv</button>
  </div>

  <div id="tab-erfassen" class="section active">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-offen">0</div><div class="stat-label">Offen</div></div>
      <div class="stat"><div class="stat-num" id="stat-archiv">0</div><div class="stat-label">Archiviert</div></div>
    </div>
    <div class="card">
      <div class="card-title">Neuer Spaziergang</div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="datum">
      </div>
      <div class="form-group">
        <label>Notiz (optional)</label>
        <input type="text" id="notiz" placeholder="z.B. 2 Runden im Park">
      </div>
      <button class="btn btn-primary" onclick="addWalk()">+ Spaziergang hinzufügen</button>
    </div>
    <button class="btn btn-secondary" onclick="switchPerson()">👤 Person wechseln</button>
  </div>

  <div id="tab-offen" class="section">
    <div class="info-box">✅ Kreis antippen = als bezahlt markieren → wandert ins Archiv</div>
    <div id="walk-list"></div>
  </div>

  <div id="tab-archiv" class="section">
    <div id="archiv-list"></div>
  </div>
</div>

<script>
  const STORAGE_A = 'dogwalk_jonna_v2';
  const STORAGE_B = 'dogwalk_theda_v2';
  let currentPerson = null;
  let walks = [];

  document.getElementById('datum').value = new Date().toISOString().split('T')[0];

  function storageKey() { return currentPerson === 'A' ? STORAGE_A : STORAGE_B; }
  function personName() { return currentPerson === 'A' ? 'Jonna' : 'Theda'; }

  function selectPerson(p) {
    currentPerson = p;
    localStorage.setItem('dogwalk_current_person', p);
    loadWalks();
    document.getElementById('screen-person').style.display = 'none';
    document.getElementById('screen-app').style.display = 'block';
    document.getElementById('person-name').textContent = personName() + ' – Spaziergänge';
  }

  function switchPerson() {
    document.getElementById('screen-app').style.display = 'none';
    document.getElementById('screen-person').style.display = 'block';
    document.getElementById('person-name').textContent = '';
  }

  function loadWalks() {
    try {
      walks = JSON.parse(localStorage.getItem(storageKey()) || '[]');
    } catch(e) { walks = []; }
    render();
  }

  function save() {
    localStorage.setItem(storageKey(), JSON.stringify(walks));
  }

  function addWalk() {
    const d = document.getElementById('datum').value;
    const n = document.getElementById('notiz').value.trim();
    if (!d) { alert('Bitte ein Datum wählen.'); return; }
    walks.unshift({ id: Date.now(), datum: d, notiz: n, paid: false });
    save();
    render();
    document.getElementById('notiz').value = '';
    showToast('Spaziergang eingetragen ✓');
  }

  function togglePaid(id) {
    const w = walks.find(x => x.id === id);
    if (!w) return;
    w.paid = true;
    save();
    render();
    showToast('Als bezahlt markiert ✓');
  }

  function formatDate(d) {
    const [y, m, day] = d.split('-');
    return `${day}.${m}.${y}`;
  }

  function render() { renderStats(); renderWalks(); renderArchiv(); }

  function renderStats() {
    document.getElementById('stat-offen').textContent = walks.filter(w => !w.paid).length;
    document.getElementById('stat-archiv').textContent = walks.filter(w => w.paid).length;
  }

  function renderWalks() {
    const list = document.getElementById('walk-list');
    const data = walks.filter(w => !w.paid);
    if (!data.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">🐕</div><p>Keine offenen Spaziergänge</p></div>';
      return;
    }
    list.innerHTML = data.map(w => `
      <div class="walk-item">
        <div class="checkbox" onclick="togglePaid(${w.id})" title="Als bezahlt markieren">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5l4 4L12 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="walk-info">
          <div class="walk-date">${formatDate(w.datum)}</div>
          <div class="walk-meta">${w.notiz || 'Kein Kommentar'}</div>
        </div>
        <span class="person-badge badge-a">${personName()}</span>
      </div>
    `).join('');
  }

  function renderArchiv() {
    const list = document.getElementById('archiv-list');
    const data = walks.filter(w => w.paid);
    if (!data.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>Noch nichts im Archiv</p></div>';
      return;
    }
    list.innerHTML = data.map(w => `
      <div class="archive-item">
        <div>
          <div class="archive-date">${formatDate(w.datum)}</div>
          <div class="archive-meta">${personName()}${w.notiz ? ' · ' + w.notiz : ''}</div>
        </div>
        <span>✅</span>
      </div>
    `).join('');
  }

  function switchTab(t) {
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', ['erfassen','offen','archiv'][i] === t);
    });
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#c2185b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.style.opacity = 1, 10);
    setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2200);
  }

  // Beim Start prüfen ob Person bereits gewählt
  const saved = localStorage.getItem('dogwalk_current_person');
  if (saved) selectPerson(saved);
</script>
</body>
</html>
