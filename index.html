<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DogWalk">
<title>DogWalk Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fdf0f7;color:#1c1c1e;min-height:100vh}
  .header{background:linear-gradient(135deg,#e0589e,#c2185b);color:#fff;padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:100}
  .header h1{font-size:20px;font-weight:700}
  .header p{font-size:13px;opacity:0.85;margin-top:3px}
  .tabs{display:flex;background:#fff;border-bottom:0.5px solid #f0c0da}
  .tab{flex:1;padding:11px 0;font-size:14px;font-weight:500;text-align:center;color:#c06090;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
  .tab.active{color:#c2185b;border-bottom-color:#c2185b}
  .section{display:none;padding:16px}
  .section.active{display:block}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:0.5px solid #f0c0da}
  .card-title{font-size:15px;font-weight:600;color:#1c1c1e;margin-bottom:12px}
  .person-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
  .badge-a{background:#fde8f4;color:#9b1a6a}
  .badge-b{background:#f8d0e8;color:#7a0f52}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:12px;color:#c06090;margin-bottom:5px;font-weight:500}
  .form-group input,.form-group select{width:100%;padding:10px 12px;border:0.5px solid #f0c0da;border-radius:10px;font-size:15px;background:#fdf7fb;color:#1c1c1e;appearance:none;-webkit-appearance:none;outline:none}
  .form-group input:focus,.form-group select:focus{border-color:#c2185b;background:#fff}
  .btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.1s}
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:linear-gradient(135deg,#e0589e,#c2185b);color:#fff}
  .walk-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:0.5px solid #f0c0da;display:flex;align-items:center;gap:12px}
  .checkbox{width:24px;height:24px;border-radius:50%;border:2px solid #f0c0da;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;background:#fff}
  .checkbox.checked{background:#c2185b;border-color:#c2185b}
  .checkbox svg{display:none}
  .checkbox.checked svg{display:block}
  .walk-info{flex:1}
  .walk-date{font-size:15px;font-weight:600;color:#1c1c1e}
  .walk-meta{font-size:12px;color:#c06090;margin-top:2px}
  .empty{text-align:center;padding:40px 20px;color:#d4a0bc}
  .empty-icon{font-size:44px;margin-bottom:8px}
  .empty p{font-size:14px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:#fff;border-radius:12px;padding:12px;text-align:center;border:0.5px solid #f0c0da}
  .stat-num{font-size:26px;font-weight:700;color:#c2185b}
  .stat-label{font-size:11px;color:#c06090;margin-top:2px}
  .filter-row{display:flex;gap:8px;margin-bottom:14px}
  .filter-btn{flex:1;padding:8px 0;border-radius:10px;border:0.5px solid #f0c0da;background:#fff;font-size:13px;font-weight:500;color:#c06090;cursor:pointer;transition:all 0.2s}
  .filter-btn.active{background:#c2185b;color:#fff;border-color:#c2185b}
  .archive-item{background:#fdf7fb;border-radius:14px;padding:13px 14px;margin-bottom:8px;border:0.5px solid #f0c0da;display:flex;justify-content:space-between;align-items:center}
  .archive-date{font-size:14px;font-weight:600;color:#7a3a5a}
  .archive-meta{font-size:12px;color:#c06090;margin-top:2px}
  .setup-box{background:#fff3f8;border:1px solid #f0c0da;border-radius:14px;padding:18px;margin:16px}
  .setup-box h2{font-size:16px;font-weight:600;color:#c2185b;margin-bottom:8px}
  .setup-box p{font-size:13px;color:#7a3a5a;margin-bottom:12px;line-height:1.5}
  .setup-box input{width:100%;padding:10px 12px;border:0.5px solid #f0c0da;border-radius:10px;font-size:14px;background:#fff;color:#1c1c1e;outline:none;margin-bottom:10px}
  .loading{text-align:center;padding:30px;color:#c06090;font-size:14px}
  .sync-indicator{font-size:11px;color:#c06090;text-align:center;padding:4px 0 8px;opacity:0;transition:opacity 0.3s}
  .sync-indicator.show{opacity:1}
</style>
</head>
<body>

<!-- SETUP (wird ausgeblendet nach Eingabe) -->
<div id="setup-screen">
  <div class="header">
    <h1>🐾 DogWalk Tracker</h1>
    <p>Einmalige Einrichtung</p>
  </div>
  <div class="setup-box">
    <h2>API-Key eingeben</h2>
    <p>Gehe auf <strong>jsonbin.io</strong>, registriere dich kostenlos und erstelle einen API-Key. Füge ihn hier ein – nur einmalig nötig!</p>
    <input type="text" id="api-key-input" placeholder="$2b$10$... (dein JSONBin API Key)">
    <button class="btn btn-primary" onclick="setupApp()">Speichern & App starten</button>
  </div>
</div>

<!-- HAUPT-APP (versteckt bis Setup fertig) -->
<div id="main-app" style="display:none">
  <div class="header">
    <h1>🐾 DogWalk Tracker</h1>
    <p>Jonna &amp; Theda</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('erfassen')">Erfassen</button>
    <button class="tab" onclick="switchTab('offen')">Offen</button>
    <button class="tab" onclick="switchTab('archiv')">Archiv</button>
  </div>
  <div class="sync-indicator" id="sync-indicator">Wird gespeichert …</div>

  <div id="tab-erfassen" class="section active">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-offen">0</div><div class="stat-label">Offen</div></div>
      <div class="stat"><div class="stat-num" id="stat-archiv">0</div><div class="stat-label">Archiviert</div></div>
    </div>
    <div class="card">
      <div class="card-title">Neuer Spaziergang</div>
      <div class="form-group">
        <label>Person</label>
        <select id="person"><option value="A">Jonna</option><option value="B">Theda</option></select>
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="datum">
      </div>
      <div class="form-group">
        <label>Notiz (optional)</label>
        <input type="text" id="notiz" placeholder="z.B. 2 Runden im Park">
      </div>
      <button class="btn btn-primary" onclick="addWalk()">+ Spaziergang hinzufügen</button>
    </div>
  </div>

  <div id="tab-offen" class="section">
    <div class="filter-row">
      <button class="filter-btn active" id="f-all" onclick="setFilter('all')">Alle</button>
      <button class="filter-btn" id="f-A" onclick="setFilter('A')">Jonna</button>
      <button class="filter-btn" id="f-B" onclick="setFilter('B')">Theda</button>
    </div>
    <div id="walk-list"></div>
  </div>

  <div id="tab-archiv" class="section">
    <div class="filter-row">
      <button class="filter-btn active" id="af-all" onclick="setArchivFilter('all')">Alle</button>
      <button class="filter-btn" id="af-A" onclick="setArchivFilter('A')">Jonna</button>
      <button class="filter-btn" id="af-B" onclick="setArchivFilter('B')">Theda</button>
    </div>
    <div id="archiv-list"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dogwalk_apikey';
  const BIN_KEY = 'dogwalk_binid';
  let walks = [];
  let filter = 'all';
  let archivFilter = 'all';
  let API_KEY = '';
  let BIN_ID = '';
  let saveTimeout = null;

  // Beim Start prüfen ob bereits eingerichtet
  window.onload = function() {
    document.getElementById('datum').value = new Date().toISOString().split('T')[0];
    API_KEY = localStorage.getItem(STORAGE_KEY) || '';
    BIN_ID = localStorage.getItem(BIN_KEY) || '';
    if (API_KEY && BIN_ID) {
      showApp();
      loadData();
    } else if (API_KEY) {
      showApp();
      createBin();
    }
  };

  async function setupApp() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key) { alert('Bitte API-Key eingeben.'); return; }
    API_KEY = key;
    localStorage.setItem(STORAGE_KEY, key);
    showApp();
    await createBin();
  }

  function showApp() {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
  }

  async function createBin() {
    showLoading();
    try {
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY, 'X-Bin-Name': 'dogwalk', 'X-Bin-Private': 'false' },
        body: JSON.stringify({ walks: [] })
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { alert('Antwort konnte nicht gelesen werden:\n' + text); return; }
      if (data.metadata && data.metadata.id) {
        BIN_ID = data.metadata.id;
        localStorage.setItem(BIN_KEY, BIN_ID);
        walks = [];
        render();
      } else {
        alert('JSONBin Fehler:\n' + JSON.stringify(data));
      }
    } catch(e) { alert('Verbindungsfehler: ' + e.message); }
  }

  async function loadData() {
    showLoading();
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      const data = await res.json();
      walks = data.record.walks || [];
      render();
    } catch(e) { showToast('Ladefehler – bitte neu laden'); }
  }

  async function saveData() {
    showSync();
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify({ walks })
      });
    } catch(e) { showToast('Speicherfehler!'); }
    hideSync();
  }

  function scheduleSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveData, 500);
  }

  function showLoading() {
    document.getElementById('walk-list').innerHTML = '<div class="loading">Lädt …</div>';
    document.getElementById('archiv-list').innerHTML = '<div class="loading">Lädt …</div>';
  }

  function showSync() {
    document.getElementById('sync-indicator').classList.add('show');
  }
  function hideSync() {
    setTimeout(() => document.getElementById('sync-indicator').classList.remove('show'), 800);
  }

  function name(p) { return p === 'A' ? 'Jonna' : 'Theda'; }

  function addWalk() {
    const p = document.getElementById('person').value;
    const d = document.getElementById('datum').value;
    const n = document.getElementById('notiz').value.trim();
    if (!d) { alert('Bitte ein Datum wählen.'); return; }
    walks.unshift({ id: Date.now(), person: p, datum: d, notiz: n, paid: false });
    document.getElementById('notiz').value = '';
    render();
    scheduleSave();
    showToast('Spaziergang eingetragen ✓');
  }

  function togglePaid(id) {
    const w = walks.find(x => x.id === id);
    if (!w) return;
    w.paid = !w.paid;
    render();
    scheduleSave();
    if (w.paid) showToast('Bezahlt – ins Archiv verschoben ✓');
  }

  function formatDate(d) {
    const [y, m, day] = d.split('-');
    return `${day}.${m}.${y}`;
  }

  function setFilter(f) {
    filter = f;
    ['all','A','B'].forEach(x => document.getElementById('f-'+x).classList.toggle('active', x === f));
    renderWalks();
  }

  function setArchivFilter(f) {
    archivFilter = f;
    ['all','A','B'].forEach(x => document.getElementById('af-'+x).classList.toggle('active', x === f));
    renderArchiv();
  }

  function render() { renderStats(); renderWalks(); renderArchiv(); }

  function renderStats() {
    document.getElementById('stat-offen').textContent = walks.filter(w => !w.paid).length;
    document.getElementById('stat-archiv').textContent = walks.filter(w => w.paid).length;
  }

  function renderWalks() {
    const list = document.getElementById('walk-list');
    let data = walks.filter(w => !w.paid);
    if (filter !== 'all') data = data.filter(w => w.person === filter);
    if (!data.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">🐕</div><p>Keine offenen Spaziergänge${filter !== 'all' ? ' für ' + name(filter) : ''}</p></div>`;
      return;
    }
    list.innerHTML = data.map(w => `
      <div class="walk-item">
        <div class="checkbox ${w.paid ? 'checked' : ''}" onclick="togglePaid(${w.id})">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5l4 4L12 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="walk-info">
          <div class="walk-date">${formatDate(w.datum)}</div>
          <div class="walk-meta">${w.notiz || 'Kein Kommentar'}</div>
        </div>
        <span class="person-badge ${w.person === 'A' ? 'badge-a' : 'badge-b'}">${name(w.person)}</span>
      </div>
    `).join('');
  }

  function renderArchiv() {
    const list = document.getElementById('archiv-list');
    let data = walks.filter(w => w.paid);
    if (archivFilter !== 'all') data = data.filter(w => w.person === archivFilter);
    if (!data.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>Noch nichts im Archiv${archivFilter !== 'all' ? ' für ' + name(archivFilter) : ''}</p></div>`;
      return;
    }
    list.innerHTML = data.map(w => `
      <div class="archive-item">
        <div>
          <div class="archive-date">${formatDate(w.datum)}</div>
          <div class="archive-meta">${name(w.person)}${w.notiz ? ' · ' + w.notiz : ''}</div>
        </div>
        <span>✅</span>
      </div>
    `).join('');
  }

  function switchTab(t) {
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', ['erfassen','offen','archiv'][i] === t);
    });
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    if (t === 'offen' || t === 'archiv') loadData();
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#c2185b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.style.opacity = 1, 10);
    setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2200);
  }
</script>
</body>
</html>
